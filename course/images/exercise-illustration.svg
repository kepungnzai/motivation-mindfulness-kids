<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Exercise releases stress energy illustration</title>
  <desc id="desc">A colorful illustration showing a child exercising, releasing stress energy like bubbles, with a calm brain and happy mood.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#d0f0ff"/>
      <stop offset="50%" stop-color="#ffe0f0"/>
      <stop offset="100%" stop-color="#a8ffd0"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#ff9f43"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" rx="36" ry="36" fill="url(#bg)"/>
  
  <!-- Ground -->
  <ellipse cx="500" cy="380" rx="420" ry="40" fill="#6bcb77" opacity="0.3"/>
  <ellipse cx="500" cy="385" rx="350" ry="25" fill="#4d96ff" opacity="0.15"/>

  <!-- Sun -->
  <circle cx="880" cy="80" r="50" fill="url(#sunGrad)" filter="url(#glow)"/>
  <g stroke="#ffd93d" stroke-width="4" stroke-linecap="round">
    <line x1="880" y1="15" x2="880" y2="30"/>
    <line x1="880" y1="130" x2="880" y2="145"/>
    <line x1="815" y1="80" x2="830" y2="80"/>
    <line x1="930" y1="80" x2="945" y2="80"/>
    <line x1="834" y1="34" x2="844" y2="44"/>
    <line x1="916" y1="116" x2="926" y2="126"/>
    <line x1="926" y1="34" x2="916" y2="44"/>
    <line x1="844" y1="116" x2="834" y2="126"/>
  </g>

  <!-- Clouds -->
  <g fill="white" opacity="0.8">
    <ellipse cx="150" cy="70" rx="60" ry="25"/>
    <ellipse cx="190" cy="55" rx="40" ry="20"/>
    <ellipse cx="115" cy="60" rx="35" ry="18"/>
    <ellipse cx="350" cy="180" rx="50" ry="20"/>
    <ellipse cx="385" cy="168" rx="35" ry="16"/>
    <ellipse cx="322" cy="172" rx="28" ry="14"/>
  </g>

  <!-- Stress energy bubbles leaving the body -->
  <g filter="url(#glow)">
    <circle cx="640" cy="130" r="18" fill="#ff6b6b" opacity="0.7">
      <animate attributeName="r" values="12;20;12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;110;150" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="100" r="12" fill="#ff9f43" opacity="0.7">
      <animate attributeName="r" values="10;16;10" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;80;120" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="160" r="8" fill="#ffd93d" opacity="0.7">
      <animate attributeName="r" values="6;12;6" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="180;140;180" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Stress symbols breaking apart -->
  <g font-family="Segoe UI Emoji, Segoe UI, Arial, sans-serif" text-anchor="middle" font-size="30">
    <text x="660" y="200" opacity="0.6" fill="#ff6b6b">💢</text>
    <text x="720" y="230" opacity="0.4" fill="#ff6b6b">😤</text>
    <text x="760" y="190" opacity="0.5" fill="#ff9f43">⚡</text>
  </g>

  <!-- Happy brain -->
  <g transform="translate(430, 190)">
    <circle cx="0" cy="0" r="55" fill="#ffb8d0" filter="url(#softShadow)">
      <animate attributeName="r" values="55;58;55" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="12" font-size="55" text-anchor="middle" font-family="Segoe UI Emoji, Segoe UI, Arial, sans-serif">😊</text>
    <!-- Brain sparkles -->
    <text x="-75" y="-45" font-size="20" fill="#ffd93d">✨</text>
    <text x="70" y="-35" font-size="16" fill="#6bcb77">✨</text>
    <text x="-60" y="40" font-size="14" fill="#4d96ff">✨</text>
    <text x="65" y="45" font-size="18" fill="#ff9f43">✨</text>
  </g>

  <!-- Running figure -->
  <g transform="translate(260, 240)">
    <!-- Body -->
    <circle cx="0" cy="-55" r="30" fill="#ffcc80" filter="url(#softShadow)"/>
    <!-- Hair -->
    <path d="M-28,-60 Q-30,-90 0,-92 Q30,-90 28,-60 Q20,-72 0,-74 Q-20,-72 -28,-60" fill="#5d4037"/>
    <!-- Face -->
    <circle cx="-10" cy="-60" r="4" fill="#333"/>
    <circle cx="10" cy="-60" r="4" fill="#333"/>
    <path d="M-8,-48 Q0,-40 8,-48" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M-8,-48 Q0,-40 8,-48;M-8,-48 Q0,-36 8,-48;M-8,-48 Q0,-40 8,-48" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <!-- Blush -->
    <circle cx="-16" cy="-50" r="5" fill="#ff9999" opacity="0.5"/>
    <circle cx="16" cy="-50" r="5" fill="#ff9999" opacity="0.5"/>
    <!-- T-shirt -->
    <path d="M-22,-40 L22,-40 L30,-10 L15,-15 L8,0 L-8,0 L-15,-15 L-30,-10 Z" fill="#667eea">
      <animate attributeName="transform" values="rotate(0);rotate(5) translateY(-3);rotate(0)" dur="0.6s" repeatCount="indefinite" additive="sum"/>
    </path>
    <!-- Arms -->
    <g stroke="#ffcc80" stroke-width="8" stroke-linecap="round">
      <path d="M-20,-35 L-45,-60 L-60,-55" fill="none">
        <animate attributeName="d" values="M-20,-35 L-45,-60 L-60,-55;M-20,-35 L-45,-70 L-62,-60;M-20,-35 L-45,-60 L-60,-55" dur="0.6s" repeatCount="indefinite"/>
      </path>
      <path d="M20,-35 L45,-60 L60,-55" fill="none">
        <animate attributeName="d" values="M20,-35 L45,-60 L60,-55;M20,-35 L45,-70 L62,-60;M20,-35 L45,-60 L60,-55" dur="0.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- Legs -->
    <g stroke="#5d4037" stroke-width="9" stroke-linecap="round">
      <path d="M-8,0 L-15,50 L-28,78" fill="none">
        <animate attributeName="d" values="M-8,0 L-15,50 L-28,78;M-8,0 L-15,50 L-8,78;M-8,0 L-15,50 L-28,78" dur="0.6s" repeatCount="indefinite"/>
      </path>
      <path d="M8,0 L15,50 L28,78" fill="none">
        <animate attributeName="d" values="M8,0 L15,50 L28,78;M8,0 L15,50 L8,78;M8,0 L15,50 L28,78" dur="0.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- Shoes -->
    <ellipse cx="-28" cy="82" rx="12" ry="6" fill="#4d96ff">
      <animate attributeName="cx" values="-28;-12;-28" dur="0.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="28" cy="82" rx="12" ry="6" fill="#4d96ff">
      <animate attributeName="cx" values="28;12;28" dur="0.6s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Motion lines -->
    <g stroke="#4d96ff" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <line x1="55" y1="-40" x2="85" y2="-40">
        <animate attributeName="x1" values="55;75;55" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="85;100;85" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="50" y1="-20" x2="75" y2="-20">
        <animate attributeName="x1" values="50;70;50" dur="0.6s" repeatCount="indefinite" begin="0.2s"/>
        <animate attributeName="x2" values="75;92;75" dur="0.6s" repeatCount="indefinite" begin="0.2s"/>
      </line>
    </g>
  </g>

  <!-- Endorphin / happy chemical tags -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(130, 120)">
      <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#6bcb77" opacity="0.9"/>
      <text x="0" y="6" font-size="16" fill="white" font-weight="bold">💊 Endorphins</text>
      <animate attributeName="transform" values="translate(130,120);translate(130,110);translate(130,120)" dur="2.2s" repeatCount="indefinite" type="translate"/>
    </g>
    <g transform="translate(120, 220)">
      <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#4d96ff" opacity="0.9"/>
      <text x="0" y="6" font-size="15" fill="white" font-weight="bold">🧠 Dopamine</text>
      <animate attributeName="transform" values="translate(120,220);translate(120,210);translate(120,220)" dur="2.5s" repeatCount="indefinite" type="translate"/>
    </g>
  </g>

  <!-- Title text -->
  <g text-anchor="middle">
    <text x="500" y="45" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#333333" opacity="0.9">
      Move It! Release the Stress! 🏃‍♀️💨
    </text>
  </g>

  <!-- Status labels at bottom -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="260" y="355" font-size="18" font-weight="bold" fill="#667eea">Before: Overthinking 😫</text>
    <text x="500" y="355" font-size="20" font-weight="bold" fill="#6bcb77">→ Exercise! 🏃 →</text>
    <text x="730" y="355" font-size="18" font-weight="bold" fill="#6bcb77">After: Calm & Focused 😌</text>
  </g>
</svg>