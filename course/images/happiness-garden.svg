<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">The Happiness Garden animation</title>
  <desc id="desc">An animated illustration of a beautiful happiness garden with growing flowers, a shining sun, flying butterflies, and sparkles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#d0f0ff"/>
      <stop offset="50%" stop-color="#e8ffe8"/>
      <stop offset="100%" stop-color="#fff0d0"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#6bcb77"/>
      <stop offset="100%" stop-color="#3a9d5d"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" rx="36" ry="36" fill="url(#bg)"/>

  <!-- Sun with rotating rays -->
  <g transform="translate(870, 75)">
    <circle cx="0" cy="0" r="45" fill="url(#sunGrad)" filter="url(#glow)"/>
    <g stroke="#ffd93d" stroke-width="4" stroke-linecap="round">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
        <line x1="0" y1="-62" x2="0" y2="-50"/>
        <line x1="0" y1="50" x2="0" y2="62"/>
        <line x1="-62" y1="0" x2="-50" y2="0"/>
        <line x1="50" y1="0" x2="62" y2="0"/>
        <line x1="-44" y1="-44" x2="-35" y2="-35"/>
        <line x1="35" y1="35" x2="44" y2="44"/>
        <line x1="44" y1="-44" x2="35" y2="-35"/>
        <line x1="-35" y1="35" x2="-44" y2="44"/>
      </g>
    </g>
    <!-- Sun face -->
    <circle cx="-12" cy="-8" r="4" fill="#e67e22"/>
    <circle cx="12" cy="-8" r="4" fill="#e67e22"/>
    <path d="M-14,8 Q0,22 14,8" stroke="#e67e22" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M-14,8 Q0,22 14,8;M-14,8 Q0,26 14,8;M-14,8 Q0,22 14,8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Clouds drifting -->
  <g fill="white" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;40,0;0,0" dur="12s" repeatCount="indefinite"/>
      <ellipse cx="150" cy="65" rx="60" ry="25"/>
      <ellipse cx="190" cy="50" rx="40" ry="20"/>
      <ellipse cx="115" cy="55" rx="35" ry="18"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-30,0;0,0" dur="15s" repeatCount="indefinite"/>
      <ellipse cx="420" cy="100" rx="50" ry="20"/>
      <ellipse cx="455" cy="88" rx="35" ry="16"/>
      <ellipse cx="392" cy="92" rx="28" ry="14"/>
    </g>
  </g>

  <!-- Ground -->
  <ellipse cx="500" cy="380" rx="460" ry="55" fill="url(#groundGrad)" opacity="0.35"/>
  <ellipse cx="500" cy="385" rx="400" ry="35" fill="#6bcb77" opacity="0.25"/>

  <!-- Grass tufts -->
  <g stroke="#4caf50" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M80,370 Q85,350 90,370"/>
    <path d="M85,370 Q90,345 95,370"/>
    <path d="M200,375 Q205,355 210,375"/>
    <path d="M205,375 Q210,350 215,375"/>
    <path d="M780,370 Q785,350 790,370"/>
    <path d="M785,370 Q790,345 795,370"/>
    <path d="M900,375 Q905,355 910,375"/>
    <path d="M905,375 Q910,350 915,375"/>
  </g>

  <!-- Watering can with animated water drops -->
  <g transform="translate(120, 300)">
    <animateTransform attributeName="transform" type="translate" values="120,300;120,295;120,300" dur="1.5s" repeatCount="indefinite"/>
    <!-- Can body -->
    <rect x="-30" y="-20" width="60" height="45" rx="10" fill="#4d96ff" filter="url(#softShadow)"/>
    <!-- Spout -->
    <path d="M30,-10 L55,-35 L62,-28 L38,-5 Z" fill="#4d96ff"/>
    <!-- Handle -->
    <path d="M-20,-20 Q0,-50 20,-20" stroke="#4d96ff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Water drops -->
    <g fill="#4d96ff" opacity="0.7">
      <circle cx="55" cy="-25" r="3">
        <animate attributeName="cy" values="-25;10;-25" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="62" cy="-20" r="2.5">
        <animate attributeName="cy" values="-20;15;-20" dur="1s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="1s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <circle cx="48" cy="-30" r="2">
        <animate attributeName="cy" values="-30;5;-30" dur="1s" repeatCount="indefinite" begin="0.6s"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="1s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
    </g>
  </g>

  <!-- Sunflower (growing) -->
  <g transform="translate(300, 330)">
    <!-- Stem -->
    <path d="M0,0 Q-5,-40 0,-80 Q5,-120 0,-160" stroke="#4caf50" stroke-width="6" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M0,0 Q-5,-40 0,-80 Q5,-120 0,-160;M0,0 Q-5,-40 0,-80 Q5,-120 0,-170;M0,0 Q-5,-40 0,-80 Q5,-120 0,-160" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Leaves -->
    <path d="M-3,-60 Q-30,-70 -25,-50 Q-20,-40 -3,-50" fill="#4caf50"/>
    <path d="M3,-100 Q30,-110 25,-90 Q20,-80 3,-90" fill="#4caf50"/>
    <!-- Flower head -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5,0,-160;5,0,-160;-5,0,-160" dur="4s" repeatCount="indefinite"/>
      <g fill="#ffd93d">
        <ellipse cx="0" cy="-170" rx="12" ry="20" transform="rotate(0 0 -170)"/>
        <ellipse cx="0" cy="-170" rx="12" ry="20" transform="rotate(45 0 -170)"/>
        <ellipse cx="0" cy="-170" rx="12" ry="20" transform="rotate(90 0 -170)"/>
        <ellipse cx="0" cy="-170" rx="12" ry="20" transform="rotate(135 0 -170)"/>
        <ellipse cx="0" cy="-170" rx="12" ry="20" transform="rotate(180 0 -170)"/>
        <ellipse cx="0" cy="-170" rx="12" ry="20" transform="rotate(225 0 -170)"/>
        <ellipse cx="0" cy="-170" rx="12" ry="20" transform="rotate(270 0 -170)"/>
        <ellipse cx="0" cy="-170" rx="12" ry="20" transform="rotate(315 0 -170)"/>
      </g>
      <circle cx="0" cy="-170" r="14" fill="#8d6e63"/>
      <!-- Sunflower face -->
      <circle cx="-5" cy="-173" r="2.5" fill="#5d4037"/>
      <circle cx="5" cy="-173" r="2.5" fill="#5d4037"/>
      <path d="M-6,-165 Q0,-159 6,-165" stroke="#5d4037" stroke-width="2" fill="none" stroke-linecap="round">
        <animate attributeName="d" values="M-6,-165 Q0,-159 6,-165;M-6,-165 Q0,-156 6,-165;M-6,-165 Q0,-159 6,-165" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Rose (growing) -->
  <g transform="translate(500, 340)">
    <!-- Stem -->
    <path d="M0,0 Q3,-30 0,-60 Q-3,-90 0,-120" stroke="#2e7d32" stroke-width="5" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M0,0 Q3,-30 0,-60 Q-3,-90 0,-120;M0,0 Q3,-30 0,-60 Q-3,-90 0,-130;M0,0 Q3,-30 0,-60 Q-3,-90 0,-120" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <!-- Thorns -->
    <path d="M-2,-45 L-12,-40 L-2,-38" fill="#2e7d32"/>
    <path d="M2,-75 L12,-70 L2,-68" fill="#2e7d32"/>
    <!-- Leaves -->
    <path d="M-2,-55 Q-25,-60 -22,-45 Q-18,-35 -2,-45" fill="#4caf50"/>
    <path d="M2,-85 Q25,-90 22,-75 Q18,-65 2,-75" fill="#4caf50"/>
    <!-- Rose bloom -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0,0,-130;8,0,-130;0,0,-130" dur="5s" repeatCount="indefinite"/>
      <circle cx="0" cy="-130" r="18" fill="#ff6b6b" filter="url(#softShadow)">
        <animate attributeName="r" values="18;20;18" dur="2s" repeatCount="indefinite"/>
      </circle>
      <path d="M-8,-138 Q0,-150 8,-138 Q0,-132 -8,-138" fill="#e74c3c"/>
      <path d="M-10,-130 Q0,-142 10,-130 Q0,-124 -10,-130" fill="#ff8a80"/>
      <path d="M-6,-122 Q0,-132 6,-122 Q0,-118 -6,-122" fill="#e74c3c"/>
      <!-- Rose face -->
      <circle cx="-4" cy="-132" r="2" fill="#5d4037"/>
      <circle cx="4" cy="-132" r="2" fill="#5d4037"/>
      <path d="M-4,-126 Q0,-121 4,-126" stroke="#5d4037" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Daisy (growing) -->
  <g transform="translate(680, 335)">
    <!-- Stem -->
    <path d="M0,0 Q-4,-35 0,-70 Q4,-105 0,-140" stroke="#4caf50" stroke-width="5" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M0,0 Q-4,-35 0,-70 Q4,-105 0,-140;M0,0 Q-4,-35 0,-70 Q4,-105 0,-150;M0,0 Q-4,-35 0,-70 Q4,-105 0,-140" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <!-- Leaves -->
    <path d="M-3,-60 Q-28,-65 -24,-48 Q-20,-38 -3,-48" fill="#4caf50"/>
    <path d="M3,-95 Q28,-100 24,-83 Q20,-73 3,-83" fill="#4caf50"/>
    <!-- Daisy petals -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0,0,-150;-6,0,-150;0,0,-150" dur="4.5s" repeatCount="indefinite"/>
      <g fill="white" stroke="#e0e0e0" stroke-width="1">
        <ellipse cx="0" cy="-158" rx="8" ry="16"/>
        <ellipse cx="0" cy="-158" rx="8" ry="16" transform="rotate(45 0 -150)"/>
        <ellipse cx="0" cy="-158" rx="8" ry="16" transform="rotate(90 0 -150)"/>
        <ellipse cx="0" cy="-158" rx="8" ry="16" transform="rotate(135 0 -150)"/>
        <ellipse cx="0" cy="-158" rx="8" ry="16" transform="rotate(180 0 -150)"/>
        <ellipse cx="0" cy="-158" rx="8" ry="16" transform="rotate(225 0 -150)"/>
        <ellipse cx="0" cy="-158" rx="8" ry="16" transform="rotate(270 0 -150)"/>
        <ellipse cx="0" cy="-158" rx="8" ry="16" transform="rotate(315 0 -150)"/>
      </g>
      <circle cx="0" cy="-150" r="10" fill="#ffd93d"/>
      <!-- Daisy face -->
      <circle cx="-3.5" cy="-152" r="2" fill="#5d4037"/>
      <circle cx="3.5" cy="-152" r="2" fill="#5d4037"/>
      <path d="M-4,-146 Q0,-141 4,-146" stroke="#5d4037" stroke-width="1.5" fill="none" stroke-linecap="round">
        <animate attributeName="d" values="M-4,-146 Q0,-141 4,-146;M-4,-146 Q0,-138 4,-146;M-4,-146 Q0,-141 4,-146" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Small sprout growing -->
  <g transform="translate(830, 360)">
    <path d="M0,0 Q-2,-15 0,-30" stroke="#4caf50" stroke-width="4" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M0,0 Q-2,-15 0,-30;M0,0 Q-2,-15 0,-40;M0,0 Q-2,-15 0,-30" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-25 Q-15,-35 -12,-20 Q-8,-12 0,-20" fill="#6bcb77">
      <animate attributeName="d" values="M0,-25 Q-15,-35 -12,-20 Q-8,-12 0,-20;M0,-35 Q-18,-45 -14,-28 Q-10,-18 0,-28;M0,-25 Q-15,-35 -12,-20 Q-8,-12 0,-20" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-25 Q15,-35 12,-20 Q8,-12 0,-20" fill="#8bc34a">
      <animate attributeName="d" values="M0,-25 Q15,-35 12,-20 Q8,-12 0,-20;M0,-35 Q18,-45 14,-28 Q10,-18 0,-28;M0,-25 Q15,-35 12,-20 Q8,-12 0,-20" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Butterfly 1 -->
  <g>
    <animateMotion dur="8s" repeatCount="indefinite" path="M200,150 C300,80 400,200 500,120 C600,60 700,180 800,100 C850,70 820,50 780,80 C700,140 600,60 500,140 C400,200 300,100 200,150"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1,1;1.1,0.9;1,1" dur="0.3s" repeatCount="indefinite" additive="sum"/>
      <ellipse cx="-10" cy="0" rx="12" ry="8" fill="#ff9f43" opacity="0.8"/>
      <ellipse cx="10" cy="0" rx="12" ry="8" fill="#ff9f43" opacity="0.8"/>
      <ellipse cx="-8" cy="0" rx="6" ry="4" fill="#ffd93d" opacity="0.9"/>
      <ellipse cx="8" cy="0" rx="6" ry="4" fill="#ffd93d" opacity="0.9"/>
      <rect x="-2" y="-8" width="4" height="16" rx="2" fill="#5d4037"/>
    </g>
  </g>

  <!-- Butterfly 2 -->
  <g>
    <animateMotion dur="10s" repeatCount="indefinite" path="M750,120 C650,60 550,180 450,100 C380,50 300,140 250,90 C220,60 240,40 280,70 C350,120 450,60 550,140 C620,190 700,100 750,120"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1,1;1.1,0.9;1,1" dur="0.35s" repeatCount="indefinite" additive="sum"/>
      <ellipse cx="-9" cy="0" rx="10" ry="7" fill="#a29bfe" opacity="0.8"/>
      <ellipse cx="9" cy="0" rx="10" ry="7" fill="#a29bfe" opacity="0.8"/>
      <ellipse cx="-7" cy="0" rx="5" ry="3.5" fill="#d0e6ff" opacity="0.9"/>
      <ellipse cx="7" cy="0" rx="5" ry="3.5" fill="#d0e6ff" opacity="0.9"/>
      <rect x="-1.5" y="-7" width="3" height="14" rx="1.5" fill="#5d4037"/>
    </g>
  </g>

  <!-- Sparkles -->
  <g font-family="Segoe UI Emoji, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="250" y="120" font-size="24" fill="#ffd93d">
      ✨
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="80" font-size="20" fill="#6bcb77">
      ✨
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="620" y="90" font-size="22" fill="#4d96ff">
      ✨
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="1.8s" repeatCount="indefinite"/>
    </text>
    <text x="760" y="60" font-size="18" fill="#ff9f43">
      ✨
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="2.2s" repeatCount="indefinite"/>
    </text>
    <text x="350" y="200" font-size="16" fill="#ff6b6b">
      ✨
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Title text -->
  <g text-anchor="middle">
    <text x="500" y="45" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#333333" opacity="0.9">
      🌷 The Happiness Garden 🌷
    </text>
  </g>

  <!-- Caption -->
  <g text-anchor="middle">
    <text x="500" y="405" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#4caf50" opacity="0.8">
      Water your garden with feel-good activities! 🌻💧
    </text>
  </g>
</svg>