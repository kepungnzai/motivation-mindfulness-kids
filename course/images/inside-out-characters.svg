<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Inside Out characters illustration</title>
  <desc id="desc">A friendly, colorful illustration representing Joy, Sadness, Anger, Fear, and Disgust from Inside Out.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffeead"/>
      <stop offset="100%" stop-color="#d0e6ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1000" height="420" rx="36" ry="36" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <circle cx="170" cy="190" r="110" fill="#ffdd57"/>
    <circle cx="360" cy="230" r="110" fill="#74b9ff"/>
    <circle cx="560" cy="200" r="110" fill="#ff7675"/>
    <circle cx="760" cy="220" r="110" fill="#a29bfe"/>
    <circle cx="910" cy="180" r="80" fill="#55efc4"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="170" y="140" font-size="72" fill="#ffffff">😊</text>
    <text x="170" y="280" font-size="28" fill="#333333">Joy</text>
    <text x="360" y="180" font-size="72" fill="#ffffff">😢</text>
    <text x="360" y="320" font-size="28" fill="#333333">Sadness</text>
    <text x="560" y="150" font-size="72" fill="#ffffff">😡</text>
    <text x="560" y="290" font-size="28" fill="#333333">Anger</text>
    <text x="760" y="160" font-size="72" fill="#ffffff">😨</text>
    <text x="760" y="300" font-size="28" fill="#333333">Fear</text>
    <text x="910" y="140" font-size="72" fill="#ffffff">🤢</text>
    <text x="910" y="260" font-size="28" fill="#333333">Disgust</text>
  </g>
  <rect x="30" y="20" width="940" height="80" rx="30" fill="#ffffff" opacity="0.55"/>
  <text x="500" y="70" font-size="36" font-family="Segoe UI, Arial, sans-serif" fill="#333333" text-anchor="middle">Inside Out Emotion Team</text>
</svg>
